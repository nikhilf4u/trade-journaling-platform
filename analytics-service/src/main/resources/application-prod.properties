server.port=${PORT:8080}

# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE (read-only)
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# FLYWAY — disabled (Analytics Service is read-only)
# ============================================================
# Analytics Service only reads from the trades table owned by Trade Service.
# It does not own any tables, so Flyway is not needed here.
spring.flyway.enabled=false

# ============================================================
# KAFKA (consumer)
# ============================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=analytics-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=TradeLoggedEvent:com.tradejournal.commonlibrary.event.TradeLoggedEvent
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual

# ============================================================
# REDIS CACHE
# ============================================================
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=4
spring.data.redis.lettuce.pool.min-idle=1

# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET}

# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.com.tradejournal=DEBUG
logging.level.org.springframework.kafka=INFO
logging.pattern.console={"timestamp":"%d{yyyy-MM-dd HH:mm:ss}", "level":"%p", "service":"analytics-service", "message":"%m"}%n