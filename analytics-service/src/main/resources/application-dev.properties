server.port=8083

# Database — reads from trade-db (same DB as Trade Service)
spring.datasource.url=jdbc:postgresql://localhost:5433/tradedb
spring.datasource.username=trader
spring.datasource.password=trader123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — read-only, no schema changes
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka Consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=analytics-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=TradeLoggedEvent:com.tradejournal.commonlibrary.event.TradeLoggedEvent

# Redis Cache
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# JWT Secret (same as other services)
jwt.secret=6E9C5F7B3A8D1E2F4C7A9B3D5E8F2C4A6B7D9E1F3C5A7B9D1E3F5A7C9B1D3E5F

logging.level.com.tradejournal=DEBUG
logging.level.org.springframework.kafka=DEBUG