server.port=${PORT:8080}

# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# FLYWAY (versioned migrations)
# ============================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ============================================================
# KAFKA (producer)
# ============================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.trusted.packages=*
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# ============================================================
# FILE UPLOAD (screenshots)
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
upload.dir=${UPLOAD_DIR:/app/uploads}

# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================
# CORS
# ============================================================
ALLOWED_ORIGINS=${ALLOWED_ORIGINS:http://localhost}

# ============================================================
# LOGGING (JSON format for production)
# ============================================================
logging.level.root=INFO
logging.level.com.tradejournal=DEBUG
logging.pattern.console={"timestamp":"%d{yyyy-MM-dd HH:mm:ss}", "level":"%p", "service":"trade-service", "message":"%m"}%n