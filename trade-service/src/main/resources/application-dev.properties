server.port=8082

# PostgreSQL (port 5433 = trade-db)
spring.datasource.url=jdbc:postgresql://localhost:5433/tradedb
spring.datasource.username=trader
spring.datasource.password=trader123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.trusted.packages=*

# JWT Secret (same as user-service)
jwt.secret=6E9C5F7B3A8D1E2F4C7A9B3D5E8F2C4A6B7D9E1F3C5A7B9D1E3F5A7C9B1D3E5F
jwt.expiration=86400000

