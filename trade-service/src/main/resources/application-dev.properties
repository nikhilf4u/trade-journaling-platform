server.port=8082

# ============================================================
# DATABASE (write — this service OWNS the schema)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5433/tradedb
spring.datasource.username=trader
spring.datasource.password=trader123
spring.datasource.driver-class-name=org.postgresql.Driver

# ⭐ CRITICAL: update = create tables if missing, alter if changed
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway disabled — Hibernate manages schema
spring.flyway.enabled=false

# ============================================================
# KAFKA
# ============================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.trusted.packages=*
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000

# ============================================================
# FILE UPLOAD
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
upload.dir=./uploads

# ============================================================
# JWT
# ============================================================
jwt.secret=6E9C5F7B3A8D1E2F4C7A9B3D5E8F2C4A6B7D9E1F3C5A7B9D1E3F5A7C9B1D3E5F

# ============================================================
# LOGGING
# ============================================================
logging.level.com.tradejournal=DEBUG
logging.level.org.springframework.kafka=WARN