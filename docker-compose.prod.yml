version: '3.8'

services:
  # ============================================================
  # DATABASES
  # ============================================================
  user-db:
    image: postgres:15-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader123
    volumes:
      - user_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 10s
      timeout: 5s
      retries: 5

  trade-db:
    image: postgres:15-alpine
    container_name: trade-db
    environment:
      POSTGRES_DB: tradedb
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader123
    volumes:
      - trade_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics-db:
    image: postgres:15-alpine
    container_name: analytics-db
    environment:
      POSTGRES_DB: analyticsdb
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader123
    volumes:
      - analytics_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  # ============================================================
  # REDIS
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: trade-redis
    ports:
      - "6379:6379"

  # ============================================================
  # KAFKA (KRaft mode - no Zookeeper)
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  # ============================================================
  # BACKEND SERVICES
  # ============================================================
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile.prod
    image: nikhilf4u/trade-journal-user-service:latest
    container_name: user-service
    depends_on:
      user-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://user-db:5432/userdb
      DATABASE_USERNAME: trader
      DATABASE_PASSWORD: trader123
      JWT_SECRET: 6E9C5F7B3A8D1E2F4C7A9B3D5E8F2C4A6B7D9E1F3C5A7B9D1E3F5A7C9B1D3E5F
      JWT_EXPIRATION: 86400000
      ALLOWED_ORIGINS: http://localhost
    ports:
      - "8081:8080"

  trade-service:
    build:
      context: .
      dockerfile: trade-service/Dockerfile.prod
    image: nikhilf4u/trade-journal-trade-service:latest
    container_name: trade-service
    depends_on:
      trade-db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://trade-db:5432/tradedb
      DATABASE_USERNAME: trader
      DATABASE_PASSWORD: trader123
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: 6E9C5F7B3A8D1E2F4C7A9B3D5E8F2C4A6B7D9E1F3C5A7B9D1E3F5A7C9B1D3E5F
      UPLOAD_DIR: /app/uploads
      ALLOWED_ORIGINS: http://localhost
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8082:8080"

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile.prod
    image: nikhilf4u/trade-journal-analytics-service:latest
    container_name: analytics-service
    depends_on:
      analytics-db:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://analytics-db:5432/analyticsdb
      DATABASE_USERNAME: trader
      DATABASE_PASSWORD: trader123
      PRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: 6E9C5F7B3A8D1E2F4C7A9B3D5E8F2C4A6B7D9E1F3C5A7B9D1E3F5A7C9B1D3E5F
    ports:
      - "8083:8080"

  # ============================================================
  # API GATEWAY
  # ============================================================
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile.prod
    image: nikhilf4u/trade-journal-api-gateway:latest
    container_name: api-gateway
    depends_on:
      - user-service
      - trade-service
      - analytics-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      USER_SERVICE_URL: http://user-service:8080
      TRADE_SERVICE_URL: http://trade-service:8080
      ANALYTICS_SERVICE_URL: http://analytics-service:8080
      JWT_SECRET: 6E9C5F7B3A8D1E2F4C7A9B3D5E8F2C4A6B7D9E1F3C5A7B9D1E3F5A7C9B1D3E5F
      ALLOWED_ORIGINS: http://localhost
    ports:
      - "8080:8080"

  # ============================================================
  # FRONTEND (Nginx + React build)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    image: nikhilf4u/trade-journal-frontend:latest
    container_name: frontend
    depends_on:
      - api-gateway
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  user_data:
  trade_data:
  analytics_data:
  uploads_data: