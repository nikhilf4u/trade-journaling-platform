server.port=8080

# ================================================================
# SPRING CLOUD GATEWAY ROUTES
# ================================================================
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=trade-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/trades/**

spring.cloud.gateway.routes[2].id=analytics-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/analytics/**

# Route for uploaded images
spring.cloud.gateway.routes[3].id=uploads
spring.cloud.gateway.routes[3].uri=http://localhost:8082
spring.cloud.gateway.routes[3].predicates[0]=Path=/uploads/**

# ================================================================
# CORS — Handled at Gateway level (services no longer need CorsConfig)
# ================================================================
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# ================================================================
# JWT (same secret as other services)
# ================================================================
jwt.secret=6E9C5F7B3A8D1E2F4C7A9B3D5E8F2C4A6B7D9E1F3C5A7B9D1E3F5A7C9B1D3E5F

# ================================================================
# LOGGING
# ================================================================
logging.level.com.tradejournal=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=INFO

# ================================================================
# ACTUATOR — exposes /actuator/gateway/routes for debugging
# ================================================================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true