server.port=${PORT:8080}

# ============================================================
# GATEWAY ROUTES
# ============================================================
# Route to User Service
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://user-service:8080}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route to Trade Service
spring.cloud.gateway.routes[1].id=trade-service
spring.cloud.gateway.routes[1].uri=${TRADE_SERVICE_URL:http://trade-service:8080}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/trades/**

# Route to Analytics Service
spring.cloud.gateway.routes[2].id=analytics-service
spring.cloud.gateway.routes[2].uri=${ANALYTICS_SERVICE_URL:http://analytics-service:8080}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/analytics/**

# Route for uploaded images
spring.cloud.gateway.routes[3].id=uploads
spring.cloud.gateway.routes[3].uri=${TRADE_SERVICE_URL:http://trade-service:8080}
spring.cloud.gateway.routes[3].predicates[0]=Path=/uploads/**

# ============================================================
# CORS (centralized at the gateway)
# ============================================================
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${ALLOWED_ORIGINS:http://localhost}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET}

# ============================================================
# ACTUATOR
# ============================================================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true
management.endpoint.health.show-details=when-authorized

# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.com.tradejournal=DEBUG
logging.level.org.springframework.cloud.gateway=INFO
logging.pattern.console={"timestamp":"%d{yyyy-MM-dd HH:mm:ss}", "level":"%p", "service":"api-gateway", "message":"%m"}%n